[phases.setup]
nixPkgs = ["python311", "gcc", "libffi"]

[phases.install]
cmds = [
  "python -m pip install --upgrade pip",
  "python -m pip install uvicorn[standard] fastapi pydantic pydantic-settings pydantic-core sqlalchemy asyncpg alembic supabase httpx python-multipart tenacity groq pillow numpy scikit-learn scipy python-dotenv"
]

[start]
cmd = "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
